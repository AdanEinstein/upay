name: Deploy Production

on:
  push:
    tags:
      - 'v*'
  # Rollback: redeploy an image that is still on the VPS (the last 5 release
  # tags are kept), skipping verify and the rebuild.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing image tag to redeploy (e.g. v1.2.0)'
        required: true

concurrency:
  group: deploy-production
  # cancelling mid-deploy can kill `migrate --force` partway through. Queue
  # instead so each deploy finishes.
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # ponytail: no shivammathur/setup-php here -- it installs via apt/sudo,
      # which hangs on a self-hosted runner without root. Build a CI toolchain
      # image instead (layer-cached across runs) and run it AS THE HOST USER
      # (--user) so vendor/, node_modules/, public/build/ and the wayfinder
      # output stay owned by the runner -- root-owned files in the workspace
      # break actions/checkout's cleanup on the next run.
      - name: Build CI toolchain image
        run: |
          cat > "$RUNNER_TEMP/upay-ci.Dockerfile" << 'EOF'
          FROM php:8.4-cli-alpine
          RUN apk add --no-cache nodejs npm git unzip curl \
              && npm install -g pnpm@10.30.3 \
              && curl -sSLf -o /usr/local/bin/install-php-extensions \
                  https://github.com/mlocati/docker-php-extension-installer/releases/latest/download/install-php-extensions \
              && chmod +x /usr/local/bin/install-php-extensions \
              && install-php-extensions mbstring xml pdo_sqlite sqlite3 gd \
              && curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
          EOF
          docker build -t upay-ci:8.4 -f "$RUNNER_TEMP/upay-ci.Dockerfile" "$RUNNER_TEMP"

      - name: Install deps, build assets, lint/type-check/test
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e npm_config_store_dir=/tmp/pnpm-store -e APP_ENV=local \
            -v "$PWD":/app -w /app upay-ci:8.4 sh -c '
              set -e
              composer install --no-interaction --prefer-dist --optimize-autoloader
              pnpm install --frozen-lockfile
              cp .env.example .env
              php artisan key:generate
              pnpm run build
              composer ci:check
            '

      - name: Clean workspace
        if: always()
        run: rm -rf vendor node_modules public/build .env bootstrap/cache/*.php

  deploy:
    needs: verify
    # runs after a green verify (tag push) or on its own for a rollback
    if: ${{ !cancelled() && (needs.verify.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: self-hosted
    environment: production
    env:
      IMAGE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check rollback image exists
        if: github.event_name == 'workflow_dispatch'
        run: docker image inspect "upay:${IMAGE_TAG}" > /dev/null

      # Values are written unquoted: the compose files read this with
      # `format: raw` (literal values, no `$` interpolation, no quote parsing).
      - name: Write .env.production
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          PASSKEYS_USER_HANDLE_SECRET: ${{ secrets.PASSKEYS_USER_HANDLE_SECRET }}
          SUPER_ADMIN_NAME: ${{ secrets.SUPER_ADMIN_NAME }}
          SUPER_ADMIN_EMAIL: ${{ secrets.SUPER_ADMIN_EMAIL }}
          SUPER_ADMIN_PASSWORD_HASH: ${{ secrets.SUPER_ADMIN_PASSWORD_HASH }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSLMODE: ${{ secrets.DB_SSLMODE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_S3_ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
          SUPABASE_S3_REGION: ${{ secrets.SUPABASE_S3_REGION }}
          SUPABASE_S3_KEY: ${{ secrets.SUPABASE_S3_KEY }}
          SUPABASE_S3_SECRET: ${{ secrets.SUPABASE_S3_SECRET }}
          SUPABASE_PUBLIC_BUCKET: ${{ secrets.SUPABASE_PUBLIC_BUCKET }}
          SUPABASE_PRIVATE_BUCKET: ${{ secrets.SUPABASE_PRIVATE_BUCKET }}
          REVERB_APP_ID: ${{ secrets.REVERB_APP_ID }}
          REVERB_APP_KEY: ${{ secrets.REVERB_APP_KEY }}
          REVERB_APP_SECRET: ${{ secrets.REVERB_APP_SECRET }}
          REVERB_HOST: ${{ secrets.REVERB_HOST }}
          REVERB_PORT: ${{ secrets.REVERB_PORT }}
          REVERB_SCHEME: ${{ secrets.REVERB_SCHEME }}
          MAIL_MAILER: ${{ secrets.MAIL_MAILER }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM_ADDRESS: ${{ secrets.MAIL_FROM_ADDRESS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPPORT_WHATSAPP: ${{ secrets.SUPPORT_WHATSAPP }}
          BILLING_PIX_KEY: ${{ secrets.BILLING_PIX_KEY }}
          BILLING_PIX_KEY_TYPE: ${{ secrets.BILLING_PIX_KEY_TYPE }}
          BILLING_MERCHANT_NAME: ${{ secrets.BILLING_MERCHANT_NAME }}
        run: |
          umask 077
          cat > .env.production <<EOF
          APP_NAME=Upay
          APP_ENV=production
          APP_DEBUG=false
          APP_KEY=${APP_KEY}
          APP_URL=${APP_URL}
          APP_VERSION=${IMAGE_TAG}

          APP_LOCALE=pt_BR
          APP_FALLBACK_LOCALE=en

          PASSKEYS_USER_HANDLE_SECRET=${PASSKEYS_USER_HANDLE_SECRET}

          SUPER_ADMIN_NAME=${SUPER_ADMIN_NAME}
          SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL}
          SUPER_ADMIN_PASSWORD_HASH=${SUPER_ADMIN_PASSWORD_HASH}

          # stderr -> docker compose logs
          LOG_CHANNEL=stack
          LOG_STACK=stderr
          LOG_LEVEL=error

          # Supabase session pooler (port 5432); the transaction pooler (6543)
          # breaks PDO's prepared statements.
          DB_CONNECTION=pgsql
          DB_HOST=${DB_HOST}
          DB_PORT=${DB_PORT}
          DB_DATABASE=${DB_DATABASE}
          DB_USERNAME=${DB_USERNAME}
          DB_PASSWORD=${DB_PASSWORD}
          DB_SSLMODE=${DB_SSLMODE}

          SESSION_DRIVER=redis
          SESSION_LIFETIME=120
          SESSION_SAME_SITE=lax
          SESSION_SECURE_COOKIE=true

          BROADCAST_CONNECTION=reverb
          QUEUE_CONNECTION=database
          CACHE_STORE=redis

          # server-to-server: the redis container on the docker network
          REDIS_CLIENT=phpredis
          REDIS_HOST=redis
          REDIS_PORT=6379

          # Uploads on Supabase Storage (S3 API): the 'public' and 'local'
          # disks switch to these buckets (see config/filesystems.php).
          FILESYSTEM_DISK=public
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_S3_ENDPOINT=${SUPABASE_S3_ENDPOINT}
          SUPABASE_S3_REGION=${SUPABASE_S3_REGION}
          SUPABASE_S3_KEY=${SUPABASE_S3_KEY}
          SUPABASE_S3_SECRET=${SUPABASE_S3_SECRET}
          SUPABASE_PUBLIC_BUCKET=${SUPABASE_PUBLIC_BUCKET}
          SUPABASE_PRIVATE_BUCKET=${SUPABASE_PRIVATE_BUCKET}

          REVERB_APP_ID=${REVERB_APP_ID}
          REVERB_APP_KEY=${REVERB_APP_KEY}
          REVERB_APP_SECRET=${REVERB_APP_SECRET}
          REVERB_HOST=${REVERB_HOST}
          REVERB_PORT=${REVERB_PORT}
          REVERB_SCHEME=${REVERB_SCHEME}

          # server-to-server publishing: talk to the reverb container directly
          # on the docker network, not through the public domain/proxy above.
          REVERB_INTERNAL_HOST=reverb
          REVERB_INTERNAL_PORT=8080
          REVERB_INTERNAL_SCHEME=http

          MAIL_MAILER=${MAIL_MAILER}
          MAIL_HOST=${MAIL_HOST}
          MAIL_PORT=${MAIL_PORT}
          MAIL_USERNAME=${MAIL_USERNAME}
          MAIL_PASSWORD=${MAIL_PASSWORD}
          MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
          MAIL_FROM_NAME=Upay
          RESEND_API_KEY=${RESEND_API_KEY}

          SUPPORT_WHATSAPP=${SUPPORT_WHATSAPP}

          BILLING_PIX_KEY=${BILLING_PIX_KEY}
          BILLING_PIX_KEY_TYPE=${BILLING_PIX_KEY_TYPE}
          BILLING_MERCHANT_NAME=${BILLING_MERCHANT_NAME}
          EOF

      - name: Build image
        if: github.event_name == 'push'
        env:
          VITE_REVERB_APP_KEY: ${{ secrets.REVERB_APP_KEY }}
          VITE_REVERB_HOST: ${{ secrets.REVERB_HOST }}
          VITE_REVERB_PORT: ${{ secrets.REVERB_PORT }}
          VITE_REVERB_SCHEME: ${{ secrets.REVERB_SCHEME }}
        run: |
          docker build \
            --build-arg VITE_APP_NAME=Upay \
            --build-arg VITE_REVERB_APP_KEY="${VITE_REVERB_APP_KEY}" \
            --build-arg VITE_REVERB_HOST="${VITE_REVERB_HOST}" \
            --build-arg VITE_REVERB_PORT="${VITE_REVERB_PORT}" \
            --build-arg VITE_REVERB_SCHEME="${VITE_REVERB_SCHEME}" \
            -t "upay:${IMAGE_TAG}" \
            -t upay:latest \
            .

      - name: Deploy
        env:
          PORT: ${{ secrets.PORT }}
        # --wait blocks until every healthcheck passes (app's start_period
        # covers the migrations), so a broken release fails the job here.
        run: docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 300

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --tail=100

      - name: Health check
        env:
          PORT: ${{ secrets.PORT }}
        run: curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "http://127.0.0.1:${PORT:-8010}/up" > /dev/null

      - name: Clean up unused docker resources
        if: always()
        run: |
          docker image prune -f
          docker builder prune -f --filter "until=72h"
          # keep the 5 most recent release images (rollback targets), drop the rest
          docker images upay --format '{{.CreatedAt}}|{{.Tag}}' \
            | grep '|v' \
            | sort -r \
            | tail -n +6 \
            | cut -d'|' -f2 \
            | grep -vx "${IMAGE_TAG}" \
            | xargs -r -I{} docker rmi "upay:{}" || true
