# Importado do field-core como ponto de partida (runner self-hosted, deploy
# via docker compose). Desativado no repo-template (workflow_dispatch apenas)
# pra não gastar Actions minutes aqui — e porque o template não tem
# docker-compose.dev.yml/secrets de deploy próprios. Adapte nome do app,
# secrets e docker-compose.*.yml em projetos derivados antes de reativar os
# triggers push/tags.
name: Deploy Development

on:
  workflow_dispatch:

concurrency:
  group: deploy-development
  # cancel-in-progress killed a running migrate:fresh mid-drop/seed when a
  # second push landed, corrupting the org table -> UNIQUE slug crash. Queue
  # instead of cancelling so each deploy's migrate:fresh always finishes.
  cancel-in-progress: false

jobs:
  verify:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # ponytail: no shivammathur/setup-php here -- that action installs via
      # apt/sudo, which hangs on a self-hosted runner without root.
      #
      # Build the CI toolchain image once (cached across runs -- same
      # Dockerfile content = same layer cache hit), then run composer/npm
      # AS THE HOST USER (--user), so vendor/, node_modules/, public/build/
      # and the wayfinder-generated resources/js/actions|routes/ come out
      # owned by the runner user instead of root. Learned the hard way:
      # root-owned output in the workspace breaks actions/checkout's own
      # cleanup on the next run.
      - name: Build CI toolchain image
        run: |
          cat > /tmp/field-core-ci.Dockerfile << 'EOF'
          FROM php:8.4-cli-alpine
          RUN apk add --no-cache nodejs npm git unzip curl \
              && curl -sSLf -o /usr/local/bin/install-php-extensions \
                  https://github.com/mlocati/docker-php-extension-installer/releases/latest/download/install-php-extensions \
              && chmod +x /usr/local/bin/install-php-extensions \
              && install-php-extensions mbstring xml pdo_sqlite sqlite3 gd \
              && curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
          EOF
          docker build -t field-core-ci:8.4 -f /tmp/field-core-ci.Dockerfile /tmp

      - name: Install deps, build assets, lint/type-check/test
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD":/app -w /app field-core-ci:8.4 sh -c '
              set -e
              composer install --no-interaction --prefer-dist --optimize-autoloader
              npm ci
              cp .env.example .env
              php artisan key:generate
              npm run build
              composer ci:check
            '

      - name: Clean workspace
        if: always()
        run: rm -rf vendor node_modules public/build .env bootstrap/cache/*.php

  deploy:
    needs: verify
    runs-on: self-hosted
    environment: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Write .env.development
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          SUPER_ADMIN_NAME: ${{ secrets.SUPER_ADMIN_NAME }}
          SUPER_ADMIN_USERNAME: ${{ secrets.SUPER_ADMIN_USERNAME }}
          SUPER_ADMIN_EMAIL: ${{ secrets.SUPER_ADMIN_EMAIL }}
          SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_PASSWORD }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          REVERB_APP_ID: ${{ secrets.REVERB_APP_ID }}
          REVERB_APP_KEY: ${{ secrets.REVERB_APP_KEY }}
          REVERB_APP_SECRET: ${{ secrets.REVERB_APP_SECRET }}
          REVERB_HOST: ${{ secrets.REVERB_HOST }}
          REVERB_PORT: ${{ secrets.REVERB_PORT }}
          REVERB_SCHEME: ${{ secrets.REVERB_SCHEME }}
          MAIL_MAILER: ${{ secrets.MAIL_MAILER }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM_ADDRESS: ${{ secrets.MAIL_FROM_ADDRESS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          cat > .env.development <<EOF
          APP_NAME=FieldCore
          APP_ENV=development
          APP_DEBUG=true
          APP_KEY=${APP_KEY}
          APP_URL=${APP_URL}

          APP_LOCALE=pt_BR
          APP_FALLBACK_LOCALE=en

          SUPER_ADMIN_NAME=${SUPER_ADMIN_NAME}
          SUPER_ADMIN_USERNAME=${SUPER_ADMIN_USERNAME}
          SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL}
          SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD}

          LOG_CHANNEL=stack
          LOG_LEVEL=debug

          DB_CONNECTION=pgsql
          DB_HOST=db
          DB_PORT=5432
          DB_DATABASE=${DB_DATABASE}
          DB_USERNAME=${DB_USERNAME}
          DB_PASSWORD=${DB_PASSWORD}

          SESSION_DRIVER=database
          SESSION_LIFETIME=120
          SESSION_SAME_SITE=lax
          SESSION_SECURE_COOKIE=true

          SANCTUM_TOKEN_PREFIX=fldc_

          BROADCAST_CONNECTION=reverb
          FILESYSTEM_DISK=local
          QUEUE_CONNECTION=database
          CACHE_STORE=database

          # fresh demo data on every development deploy (see docker/entrypoint.sh)
          SEED_DEMO_DATA=true

          REVERB_APP_ID=${REVERB_APP_ID}
          REVERB_APP_KEY=${REVERB_APP_KEY}
          REVERB_APP_SECRET=${REVERB_APP_SECRET}
          REVERB_HOST=${REVERB_HOST}
          REVERB_PORT=${REVERB_PORT}
          REVERB_SCHEME=${REVERB_SCHEME}

          # server-to-server publishing: talk to the reverb container directly
          # on the docker network, not through the public domain/proxy above.
          REVERB_INTERNAL_HOST=reverb
          REVERB_INTERNAL_PORT=8080
          REVERB_INTERNAL_SCHEME=http

          MAIL_MAILER=${MAIL_MAILER}
          MAIL_HOST=${MAIL_HOST}
          MAIL_PORT=${MAIL_PORT}
          MAIL_USERNAME=${MAIL_USERNAME}
          MAIL_PASSWORD=${MAIL_PASSWORD}
          MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
          MAIL_FROM_NAME=FieldCore
          RESEND_API_KEY=${RESEND_API_KEY}

          VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
          VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
          VAPID_SUBJECT=${VAPID_SUBJECT}
          EOF

      - name: Build image
        env:
          VITE_APP_NAME: FieldCore
          VITE_REVERB_APP_KEY: ${{ secrets.REVERB_APP_KEY }}
          VITE_REVERB_HOST: ${{ secrets.REVERB_HOST }}
          VITE_REVERB_PORT: ${{ secrets.REVERB_PORT }}
          VITE_REVERB_SCHEME: ${{ secrets.REVERB_SCHEME }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
        run: |
          docker build \
            --build-arg VITE_APP_NAME="${VITE_APP_NAME}" \
            --build-arg VITE_REVERB_APP_KEY="${VITE_REVERB_APP_KEY}" \
            --build-arg VITE_REVERB_HOST="${VITE_REVERB_HOST}" \
            --build-arg VITE_REVERB_PORT="${VITE_REVERB_PORT}" \
            --build-arg VITE_REVERB_SCHEME="${VITE_REVERB_SCHEME}" \
            --build-arg VITE_VAPID_PUBLIC_KEY="${VITE_VAPID_PUBLIC_KEY}" \
            --build-arg INCLUDE_DEV_DEPS=true \
            -t field-core:latest \
            .

      - name: Deploy
        env:
          PORT: ${{ secrets.PORT }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: docker compose -f docker-compose.dev.yml up -d

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs --tail=100

      - name: Health check
        env:
          PORT: ${{ secrets.PORT }}
        run: |
          sleep 10
          curl -f http://127.0.0.1:${PORT}/up || exit 1

      - name: Clean up unused docker resources
        if: always()
        run: |
          docker container prune -f
          docker image prune -f
          docker builder prune -f --filter "until=72h"
